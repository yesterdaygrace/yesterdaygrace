Consolas,monospace" font-size="12" font-weight="800" fill="#fafafa" letter-spacing=".5">NUXT UI</text><text x="822" y="274" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">live updates via SSE</text><text x="34" y="320" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="800" fill="#71717a" letter-spacing="2">// HIGHLIGHTS</text><path d="M150 316H976" stroke="#27272a"/><rect x="34" y="339" width="7" height="7" fill="#86d3a6"/><text x="54" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">Saving a post on threads.net streams it to the local app and shows a toast</text><rect x="34" y="369" width="7" height="7" fill="#86d3a6"/><text x="54" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">MutationObserver captures new bookmarks as the /saved feed scrolls; a bulk scan walks the full history</text><rect x="34" y="399" width="7" height="7" fill="#86d3a6"/><text x="54" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">Offline queue in chrome.storage.local flushes when the backend returns</text><rect x="34" y="429" width="7" height="7" fill="#86d3a6"/><text x="54" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">Meta's Threads API has no Saved or Unsave endpoint, so the project reads the logged-in site instead</text><rect x="34" y="459" width="7" height="7" fill="#86d3a6"/><text x="54" y="468" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">Tokens are AES-256-GCM encrypted at rest; sessions store only a SHA-256 hash; OAuth state guards against</text><text x="54" y="490" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e4e4e7">login CSRF</text></svg>